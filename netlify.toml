[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22.22.3"

[functions]
  included_files = ["data.json"]
  node_bundler = "esbuild"

[[plugins]]
  package = "./plugins/netlify-plugin-publish-masto"

[[redirects]]
  from = "/new"
  to = "https://github.com/maxxcrawford/current-status/issues/new?template=status-post.yml"
  status = 302
  force = true
